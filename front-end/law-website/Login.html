<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log In</title>
  <style>
    body {
      font-family: sans-serif;
      background: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    form {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 1rem;
    }

    input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
    }

    button {
      margin-top: 1.5rem;
      width: 100%;
      background-color: #004080;
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0066cc;
    }
  </style>
</head>
<body>
  <form action="/login" method="POST">
    <h2>Log In</h2>
    <label>Username:<br><input type="text" name="username" required></label>
    <label>Password:<br><input type="password" name="password" required></label>
    <button type="submit">Login</button>
  </form>
</body>
</html>
