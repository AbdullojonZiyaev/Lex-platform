<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Law Forum for Startups</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      background-color: #003366;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav .nav-links a {
      color: white;
      margin-left: 1rem;
      text-decoration: none;
    }

    nav .nav-links a:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .section {
      border: 1px solid #ccc;
      padding: 1.5rem;
      border-radius: 8px;
      background-color: #f9f9f9;
    }

    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    .modal {
    display: none;
    position: fixed;
    z-index: 99;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    padding: 2rem;
    border-radius: 10px;
    text-align: center;
  }

  .modal-content button {
    margin: 1rem;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
  }

  </style>

  <script>
      function openSignUpModal() {
      document.getElementById('roleModal').style.display = 'flex';
      }
    
      function closeSignUpModal() {
      document.getElementById('roleModal').style.display = 'none';
      }
    
      function chooseRole(role) {
        if (role === 'startup') {
          window.location.href = 'SignupStartup.html';
        } else if (role === 'lawyer') {
          window.location.href = 'SignupLawyer.html';
        }
      }

  </script>
</head>
<body>

  <nav>
    <div class="logo">LawStart</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="Login.html">Log In</a>
      <a href="#" onclick="openSignUpModal()">Sign Up</a>
      <a href="#">Contact Us</a>
    </div>
  </nav>

  <main>
    <div class="modal" id="roleModal">
        <div class="modal-content">
          <h3>Sign up as:</h3>
          <button onclick="chooseRole('startup')">Startup</button>
          <button onclick="chooseRole('lawyer')">Lawyer</button>
          <br />
          <button onclick="closeSignUpModal()">Cancel</button>
        </div>
      </div>
    <div class="section">Section 1 - Welcome or Featured Q&A</div>
    <div class="section">Section 2 - Latest Legal Questions</div>
    <div class="section">Section 3 - Lawyer Highlights or Help Center</div>
  </main>

  <footer>
    &copy; 2025 LawStart. All rights reserved.
  </footer>

</body>
</html>
