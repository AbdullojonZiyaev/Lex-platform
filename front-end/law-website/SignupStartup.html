<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Startup Sign-Up</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f7fc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 300px;
    }

    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.75rem;
    }

    input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.5rem;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005599;
    }
  </style>
</head>
<body>
  <form action="/register-startup" method="POST">
    <h2>Startup Sign-Up</h2>
    <label>Name:<br><input type="text" name="name" required></label>
    <label>Email:<br><input type="email" name="email" required></label>
    <label>Password:<br><input type="password" name="password" required></label>
    <button type="submit">Register</button>
  </form>
</body>
</html>
